[project]
name = "appa"
version = "0.1.0"
description = "Job intake pipeline: ingest postings, filter by work-authorization and experience rules, dedupe against your tracker."
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "openai>=1.60",  # OpenAI-compatible client, pointed at OpenRouter
    "pydantic>=2.10",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "croniter>=2.0",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "python-multipart>=0.0.9",
    "pillow>=10.4",
    "playwright>=1.48",  # browser runner (uses your installed Chrome)
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "defusedxml>=0.7",  # XML/RSS job feeds, parsed without entity expansion
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8"]

[project.scripts]
appa = "appa.cli:main"

[build-system]
requires = ["setuptools>=77"]  # 77+: SPDX license expressions
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["appa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["web", "data", "evals/local"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["UP", "E501"]   # Alembic-generated style
"tests/**" = ["E501"]                      # inline HTML/JSON fixtures and real URLs read better unwrapped
"appa/runner/dom.py" = ["E501"]            # embedded JavaScript run in the page

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form", "fastapi.Header"]
