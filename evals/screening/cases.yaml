    Java or C#, SQL. Must be authorized to work in the US.
  expect: {verdict: review, staffing_agency: true, is_entry_level: true}

- id: nothing-mentioned
  company: Brightwater Labs
  title: Software Engineer, New Grad
  posting: |
    Brightwater Labs builds developer tools for testing mobile apps. As a new grad engineer you
    will build features in TypeScript and Kotlin, write tests, and talk to customers.
