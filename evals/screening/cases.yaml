    Computer Science; 3+ years of programming experience through coursework, projects or
    internships; proficiency in at least one of Go, Java, C++ or Python.
  expect: {verdict: candidate, is_entry_level: true}

- id: preferred-years-not-required
  company: Oakline Learning
  title: Software Engineer, Early Career
  posting: |
    Oakline Learning builds reading tools for elementary schools. Early-career engineers build
