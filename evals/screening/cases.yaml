# Synthetic screening cases. Written for this repo, not real postings, so they're safe to
# publish. Each case: a posting plus what a correct screener should conclude.
#
# Scored with a fixed eval policy (appa/evals.py: needs sponsorship in the future, max 2
# years, rejects citizenship/clearance), so results are comparable across machines.
#
# expect fields (all optional; only the ones present are scored):
#   verdict: candidate | review | reject | manual   (or a list of acceptable verdicts)
#   sponsorship: will_sponsor | no_sponsorship_now_or_future | no_sponsorship_unspecified
#                | authorized_to_work_only | not_mentioned
#   citizenship_required, clearance_required, is_entry_level, staffing_agency, suspicious: bool
#   min_years_experience: int or null

- id: no-sponsorship-explicit
  company: Northwind Analytics
  title: Software Engineer, New Grad
  posting: |
    Northwind Analytics builds forecasting tools for regional grocery chains. As a new grad
    software engineer you'll join our platform team and ship features in Python and TypeScript
    from your first month. We look for strong CS fundamentals and curiosity.
    Requirements: BS in Computer Science or related field by June 2027. Experience with one
    modern programming language through coursework, internships or projects.
    Work authorization: Applicants must be currently authorized to work in the United States on
    a full-time basis. Northwind will not sponsor applicants for work visa status now or in the future.
  expect: {verdict: reject, sponsorship: no_sponsorship_now_or_future, is_entry_level: true, min_years_experience: null}

- id: authorized-only
  company: Bluefin Robotics
  title: Software Engineer I
  posting: |
    Bluefin Robotics makes autonomous inspection drones for offshore wind farms. Software
    Engineer I is an early-career role on our fleet software team: telemetry pipelines,
    mission planning services and internal tools, mostly in Go and Python.
    You have: a degree in CS or a related field, 0-1 years of experience including internships,
    solid data structures and algorithms. Nice to have: robotics or embedded coursework.
    Candidates must be legally authorized to work in the United States.
  expect: {verdict: candidate, sponsorship: authorized_to_work_only, is_entry_level: true, citizenship_required: false}

- id: will-sponsor
  company: Lumen Ledger
  title: Graduate Software Engineer (2027)
  posting: |
    Lumen Ledger is a fintech startup building reconciliation software for mid-size banks.
    Our 2027 graduate program places new engineers on product teams with a dedicated mentor.
    What we look for: graduating between December 2026 and June 2027 with a degree in a
    technical field, strong programming skills in any language, and clear communication.
    Visa sponsorship: we sponsor H-1B visas and support OPT and STEM OPT extensions for
    graduate program hires.
  expect: {verdict: candidate, sponsorship: will_sponsor, is_entry_level: true}

- id: no-sponsorship-unspecified
  company: Cedar & Pine Health
  title: Junior Backend Engineer
  posting: |
    Cedar & Pine Health runs scheduling software for 400 physical therapy clinics. As a junior
    backend engineer you'll work in Java and Spring Boot on our appointment and billing services.
    Requirements: bachelor's degree in computer science or equivalent experience; familiarity
    with REST APIs and SQL; 0-2 years of professional experience.
    Please note: we are unable to provide visa sponsorship for this position.
  expect: {verdict: review, sponsorship: no_sponsorship_unspecified, is_entry_level: true}

- id: citizenship-required
  company: Ironbridge Systems
  title: Associate Software Engineer
  posting: |
    Ironbridge Systems develops logistics software for federal agencies. Associate Software
    Engineers build and test web applications in C# and React for our government customers.
    Basic qualifications: BS in Computer Science, Computer Engineering or related discipline;
    0-2 years of experience. Due to the nature of our federal contracts, U.S. citizenship is
    required for this position.
  expect: {verdict: reject, citizenship_required: true, is_entry_level: true}

- id: itar-us-person
  company: Skyward Propulsion
  title: Software Engineer, Flight Software (New Grad)
  posting: |
    Skyward Propulsion designs electric propulsion systems for small satellites. New grad flight
    software engineers write embedded C++ for thruster controllers and ground test equipment.
    Requirements: degree in CS, EE or aerospace; embedded or real-time coursework or projects.
    This position requires access to technology subject to the International Traffic in Arms
    Regulations (ITAR). Applicants must be U.S. persons as defined by ITAR (U.S. citizens or
    lawful permanent residents).
  expect: {verdict: reject, citizenship_required: true, is_entry_level: true}

- id: clearance-required
  company: Granite Defense Labs
  title: Software Engineer I
  posting: |
    Granite Defense Labs builds signal processing software for national security customers.
    Software Engineer I candidates will develop Python and C++ tools for data analysis.
    Required: BS in a technical field; 0-2 years of experience; an active Secret security
    clearance is required at the start of employment.
  expect: {verdict: reject, clearance_required: true, is_entry_level: true}

- id: clearance-preferred-only
  company: Harborview Maps
  title: Junior Software Engineer
  posting: |
    Harborview Maps builds mapping software used by city planners and some public-sector
    customers. Junior engineers work on our tile rendering service and React front end.
    Required: CS degree or equivalent, JavaScript or TypeScript, interest in GIS.
    Preferred: experience with PostGIS. An existing security clearance is a plus but not
    required; most of our work does not need one.
  expect: {verdict: [candidate, review], clearance_required: false, citizenship_required: false}

- id: five-years-senior
  company: Quartz Commerce
  title: Software Engineer
  posting: |
    Quartz Commerce powers checkout for 2,000 online stores. We're hiring a software engineer to
    lead projects on our payments platform. Requirements: 5+ years of professional software
    engineering experience, deep knowledge of distributed systems, experience mentoring others,
    and a track record of owning services in production.
  expect: {verdict: reject, min_years_experience: 5, is_entry_level: false}

- id: two-years-ok
  company: Tidewater Energy Software
  title: Software Engineer
  posting: |
    Tidewater Energy Software helps utilities plan battery storage. Engineers on our modeling
    team build Python services and data pipelines. Requirements: 2+ years of professional
    software development experience (internships may count toward this), Python, SQL, and
    comfort working with large datasets. Nice to have: power systems background.
  expect: {verdict: candidate, min_years_experience: 2}

- id: new-grad-program-lists-years
  company: Meridian Cloud
  title: Software Engineer, University Graduate 2027
  posting: |
    Meridian Cloud's University Graduate program hires students graduating in 2027 into
